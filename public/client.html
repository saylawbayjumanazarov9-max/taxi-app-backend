<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijoz Paneli - Xarita</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="info-box" id="status">Taksi qidirilmoqda...</div>
    <div id="map"></div>

    <script>
        const socket = io();
        let map = L.map('map').setView([41.311081, 69.240562], 13);
        let driverMarker = null;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        socket.on('connect', () => {
            document.getElementById('status').innerText = "Serverga ulandik. Haydovchi kutilmoqda...";
        });

        socket.on('driverLocationUpdated', (data) => {
            const { latitude, longitude, driverId } = data;
            document.getElementById('status').innerText = `Haydovchi (${driverId}) onlayn!`;

            if (driverMarker) {
                driverMarker.setLatLng([latitude, longitude]);
            } else {
                driverMarker = L.marker([latitude, longitude]).addTo(map)
                    .bindPopup("🚖 Sizning taksingiz").openPopup();
            }

            map.setView([latitude, longitude], 15);
        });
    </script>
</body>
</html>
